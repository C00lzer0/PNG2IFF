[package]
name = "Png2Iff"
version = "0.1.0"
edition = "2024"
description = "Konvertiert PNG-Bilder in das Amiga IFF-ILBM-Format (CLI, Desktop-GUI, WebAssembly)"

[lib]
name = "png2iff_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "png2iff"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
png = "0.18"
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
