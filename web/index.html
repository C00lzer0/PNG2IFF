<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0055aa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Png2Iff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Png2Iff – PNG nach Amiga IFF</title>
  <style>
    :root { color-scheme: light dark; --blue: #0055aa; --orange: #ff8800; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    header { background: var(--blue); color: #fff; padding: .8rem 1rem; }
    header h1 { margin: 0; font-size: 1.2rem; }
    main { display: grid; gap: 1rem; padding: 1rem; max-width: 1200px; margin: 0 auto; grid-template-columns: 1fr; }
    @media (min-width: 800px) { main { grid-template-columns: 300px 1fr; } }
    fieldset { border: 1px solid #8886; border-radius: 8px; margin: 0 0 .8rem; padding: .5rem .8rem; }
    legend { font-weight: 600; }
    label { display: block; padding: .15rem 0; }
    input[type=range] { width: 100%; }
    button, .btn { font: inherit; padding: .6rem 1rem; border-radius: 8px; border: 0; background: var(--blue); color: #fff; cursor: pointer; display: inline-block; }
    button:disabled { opacity: .4; cursor: default; }
    [hidden] { display: none !important; }
    #drop { border: 2px dashed #8887; border-radius: 12px; padding: 1.2rem; text-align: center; margin-bottom: 1rem; }
    #drop.over { border-color: var(--orange); background: #ff880022; }
    .previews { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .previews figure { margin: 0; }
    figcaption { font-weight: 600; margin-bottom: .3rem; }
    canvas { width: 100%; height: auto; image-rendering: pixelated; border: 1px solid #8886;
      background: repeating-conic-gradient(#8884 0% 25%, transparent 0% 50%) 0 0 / 16px 16px; }
    #info { margin: .8rem 0; }
    #error { color: #c00; }
    #bgrow { display: flex; align-items: center; gap: .5rem; }
  </style>
</head>
<body>
  <header><h1>Png2Iff – PNG nach Amiga IFF (ILBM)</h1></header>
  <main>
    <aside>
      <fieldset>
        <legend>Format</legend>
        <label><input type="radio" name="mode" value="indexed" checked> Palette (2–256 Farben)</label>
        <label><input type="radio" name="mode" value="ehb"> EHB (64 Farben)</label>
        <label><input type="radio" name="mode" value="ham6"> HAM6 (4096 Farben)</label>
        <label><input type="radio" name="mode" value="ham8"> HAM8 (262144 Farben)</label>
      </fieldset>
      <fieldset>
        <legend>Palette</legend>
        <label>Max. Bitplanes: <b id="planesVal">5</b>
          <input id="planes" type="range" min="1" max="8" value="5"></label>
        <label><input id="autoPlanes" type="checkbox" checked> Planes automatisch reduzieren</label>
        <label><input id="ocs" type="checkbox"> OCS/ECS-Palette (4 Bit)</label>
        <label><input id="dither" type="checkbox"> Dithering (Floyd-Steinberg)</label>
      </fieldset>
      <fieldset>
        <legend>Transparenz</legend>
        <label><input type="radio" name="transparency" value="mask" checked> Maskenebene</label>
        <label id="keyRow"><input type="radio" name="transparency" value="key"> Transparente Farbe (Index 0)</label>
        <label><input type="radio" name="transparency" value="none"> Keine (Hintergrund verrechnen)</label>
        <div id="bgrow"><input id="bg" type="color" value="#000000"><span>Hintergrundfarbe</span></div>
      </fieldset>
      <fieldset>
        <legend>Datei</legend>
        <label><input id="compress" type="checkbox" checked> ByteRun1-Kompression</label>
      </fieldset>
    </aside>
    <section>
      <div id="drop">
        <p>PNG-Datei hierher ziehen oder auswählen</p>
        <label class="btn">PNG öffnen…<input id="file" type="file" accept="image/png,.png" hidden></label>
      </div>
      <p id="error" role="alert"></p>
      <div class="previews" id="previews" hidden>
        <figure><figcaption>Original</figcaption><canvas id="orig"></canvas></figure>
        <figure><figcaption>Amiga-Vorschau</figcaption><canvas id="prev"></canvas></figure>
      </div>
      <p id="info"></p>
      <button id="save" disabled>Als IFF speichern</button>
      <a id="dlLink" class="btn" hidden>Herunterladen</a>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
